apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: jellyfin
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: jellyfin-local
  local:
    path: /filesystem/k3s/data/jellyfin/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - openmediavault
