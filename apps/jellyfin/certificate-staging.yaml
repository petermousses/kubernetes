apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-staging
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: jellyfin
spec:
  secretName: jellyfin-tls-staging
  dnsNames:
    - jellyfin.omv.mousses.xyz
  issuerRef:
    name: letsencrypt-staging-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
