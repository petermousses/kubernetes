apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-routes
  namespace: external-routes
  labels:
    app.kubernetes.io/part-of: external-routes
spec:
  secretName: external-routes-tls
  dnsNames:
    - nas.omv.mousses.xyz
    - dns.omv.mousses.xyz
  issuerRef:
    name: letsencrypt-production-cloudflare
    kind: ClusterIssuer
