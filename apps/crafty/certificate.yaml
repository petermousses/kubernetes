apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty
  namespace: crafty
  labels:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/part-of: crafty
spec:
  secretName: crafty-tls
  dnsNames:
    - crafty.omv.mousses.xyz
    - map.omv.mousses.xyz
  issuerRef:
    name: letsencrypt-production-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
