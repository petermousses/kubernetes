apiVersion: v1
kind: Service
metadata:
  name: restic
  labels:
    app.kubernetes.io/name: restic-server
    app.kubernetes.io/part-of: searxng
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: restic-server
  ports:
    - name: https
      port: 8000
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-server
  labels:
    app.kubernetes.io/name: restic-server
    app.kubernetes.io/part-of: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restic-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic-server
        app.kubernetes.io/part-of: searxng
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restic-server
          # restic/rest-server 0.14.0, multi-platform manifest.
          image: restic/rest-server@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              tls_generation="$(readlink -f /tls/..data)"
              auth_generation="$(readlink -f /auth/..data)"
              cp "$tls_generation/tls.crt" /tmp/tls.crt
              cp "$tls_generation/tls.key" /tmp/tls.key
              cp "$auth_generation/htpasswd" /tmp/htpasswd
              exec /usr/bin/rest-server \
                --path=/repositories \
                --listen=:8000 \
                --htpasswd-file=/tmp/htpasswd \
                --private-repos \
                --tls --tls-min-ver=1.3 \
                --tls-cert=/tmp/tls.crt --tls-key=/tmp/tls.key
          ports:
            - name: https
              containerPort: 8000
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          # rest-server loads TLS/auth at startup. Restart when projected
          # secrets change so certificate renewals and credential updates apply.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  cmp -s /tls/tls.crt /tmp/tls.crt &&
                  cmp -s /tls/tls.key /tmp/tls.key &&
                  cmp -s /auth/htpasswd /tmp/htpasswd
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: repositories
              mountPath: /repositories
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: repositories
          persistentVolumeClaim:
            claimName: restic-repositories
        - name: tls
          secret:
            secretName: restic-server-tls
            defaultMode: 0440
        - name: auth
          secret:
            secretName: restic-server-auth
            defaultMode: 0440
            items:
              - key: .htpasswd
                path: htpasswd
        - name: temp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
      terminationGracePeriodSeconds: 30
