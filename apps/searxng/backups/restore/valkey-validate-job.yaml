apiVersion: batch/v1
kind: Job
metadata:
  name: valkey-restore-validation-initial
  namespace: searxng
  labels:
    app.kubernetes.io/name: searxng-restore-validation
    app.kubernetes.io/part-of: searxng
    app.kubernetes.io/managed-by: nas-backup-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng-restore-validation
        app.kubernetes.io/part-of: searxng
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validate
          image: docker.io/valkey/valkey@sha256:d1cc70645bbcef743615463a2fa4616e841407545e18f560aed0c49671a90147
          workingDir: /tmp
          command: [/bin/sh, -ec]
          args:
            - |
              set -u
              umask 077
              test -z "$(ls -A /restore)"
              work=/restore/validated
              mkdir "$work"
              chmod 700 "$work"
              server_pid=
              cleanup() {
                result=$?
                trap - EXIT HUP INT TERM
                if [ -n "$server_pid" ]; then
                  timeout 5 valkey-cli -s /tmp/valkey-restore.sock SHUTDOWN NOSAVE >"$work/shutdown.log" 2>&1 ||
                    kill "$server_pid" 2>/dev/null || true
                  wait "$server_pid" 2>/dev/null || true
                fi
                if [ "$result" -ne 0 ]; then
                  printf '%s\n' 'Valkey restore validation failed; private scratch evidence preserved' >&2
                fi
                exit "$result"
              }
              trap cleanup EXIT
              trap 'exit 130' INT
              trap 'exit 143' HUP TERM
              cp "$ARTIFACT_DIRECTORY/dump.rdb" "$work/dump.rdb"
              chmod 600 "$work/dump.rdb"
              printf '%s  %s\n' "$DUMP_SHA256" "$work/dump.rdb" | sha256sum -c -s
              valkey-check-rdb "$work/dump.rdb" >"$work/rdb-check.txt" 2>&1
              read_keys="$(awk '/ keys read$/ {print $(NF-2)}' "$work/rdb-check.txt")"
              expiring="$(awk '/ expires$/ {print $(NF-1)}' "$work/rdb-check.txt")"
              for count in "$read_keys" "$expiring"; do
                case "$count" in ""|*[!0-9]*) exit 1;; esac
              done
              valkey-server --port 0 --unixsocket /tmp/valkey-restore.sock --unixsocketperm 700 \
                --dir "$work" --dbfilename dump.rdb --save "" --appendonly no \
                --protected-mode yes --daemonize no >"$work/server.log" 2>&1 &
              server_pid=$!
              deadline=$(($(date +%s) + 60))
              until [ "$(timeout 5 valkey-cli -s /tmp/valkey-restore.sock --raw PING 2>/dev/null)" = PONG ]; do
                kill -0 "$server_pid"
                test "$(date +%s)" -lt "$deadline"
                sleep 1
              done
              timeout 5 valkey-cli -s /tmp/valkey-restore.sock --raw INFO persistence >"$work/persistence.txt"
              loaded="$(tr -d '\r' <"$work/persistence.txt" | awk -F: '$1 == "rdb_last_load_keys_loaded" {print $2}')"
              expired="$(tr -d '\r' <"$work/persistence.txt" | awk -F: '$1 == "rdb_last_load_keys_expired" {print $2}')"
              loading="$(tr -d '\r' <"$work/persistence.txt" | awk -F: '$1 == "loading" {print $2}')"
              aof="$(tr -d '\r' <"$work/persistence.txt" | awk -F: '$1 == "aof_enabled" {print $2}')"
              for count in "$loaded" "$expired"; do
                case "$count" in ""|*[!0-9]*) exit 1;; esac
              done
              test "$loading" = 0
              test "$aof" = 0
              test "$((loaded + expired))" -eq "$read_keys"
              test "$expired" -le "$expiring"
              probe="restore-validation:$BACKUP_ID"
              test "$(timeout 5 valkey-cli -s /tmp/valkey-restore.sock --raw SET "$probe" restore-ok NX)" = OK
              test "$(timeout 5 valkey-cli -s /tmp/valkey-restore.sock --raw GET "$probe")" = restore-ok
              test "$(timeout 5 valkey-cli -s /tmp/valkey-restore.sock --raw DEL "$probe")" = 1
              timeout 5 valkey-cli -s /tmp/valkey-restore.sock SHUTDOWN NOSAVE >"$work/shutdown.log" 2>&1
              wait "$server_pid"
              server_pid=
              printf '%s  %s\n' "$DUMP_SHA256" "$work/dump.rdb" | sha256sum -c -s
              printf '{"result":"passed","claim":"searxng-valkey","backup_id":"%s","keys_read":%s,"keys_loaded":%s,"keys_expired":%s,"private_socket_check":true}\n' \
                "$BACKUP_ID" "$read_keys" "$loaded" "$expired" >"$work/result.json"
              printf 'Valkey RDB loaded: %s keys loaded, %s expired; private socket checks and clean shutdown passed\n' "$loaded" "$expired"
              printf 'RESTORE_VALIDATED_JSON='
              cat "$work/result.json"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
              readOnly: true
            - name: restored
              mountPath: /restore
            - name: temp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: valkey-restore-artifacts
            readOnly: true
        - name: restored
          persistentVolumeClaim:
            claimName: valkey-restore-data
        - name: temp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
