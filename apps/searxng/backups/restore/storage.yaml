apiVersion: v1
kind: PersistentVolume
metadata:
  name: searxng-valkey-restore-artifacts
spec:
  capacity:
    storage: 2Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: searxng-backup-local
  claimRef:
    namespace: searxng
    name: valkey-restore-artifacts
  local:
    path: /filesystem/k3s/data/searxng/restore-validation/searxng-valkey/initial/artifacts
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-restore-artifacts
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: searxng-backup-local
  volumeName: searxng-valkey-restore-artifacts
  resources:
    requests:
      storage: 2Gi
---
