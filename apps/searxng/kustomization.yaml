apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: searxng
resources:
  - namespace.yaml
  - storage-class.yaml
  - persistent-volumes.yaml
  - persistent-volume-claims.yaml
  - deployment.yaml
  - statefulset.yaml
  - service.yaml
  - ingress.yaml
  - certificate.yaml
  - certificate-staging.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: searxng-config
    files:
      - settings.yml=config/settings.yml
      - limiter.toml=config/limiter.toml
generatorOptions:
  disableNameSuffixHash: true
