apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: litellm
    app.kubernetes.io/version: 1.103.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: litellm
        app.kubernetes.io/version: 1.103.0
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: litellm
          # ghcr.io/berriai/litellm:v1.103.0; Cosign-verified index digest.
          image: ghcr.io/berriai/litellm@sha256:bd089afdcd35b894b14a93f9743cdc8b591f82da1a38dd43a010a7b0c9de5fd7
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --host
            - 0.0.0.0
            - --port
            - "4000"
            - --num_workers
            - "1"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: litellm-env
          env:
            - name: DISABLE_ADMIN_UI
              value: "true"
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
            - name: LITELLM_LOG
              value: ERROR
            - name: LITELLM_MODE
              value: PRODUCTION
            - name: LITELLM_NON_ROOT
              value: "true"
            - name: LITELLM_MIGRATION_DIR
              value: /app/migrations
            - name: PRISMA_BINARY_CACHE_DIR
              value: /app/cache/prisma
            - name: TYPESAFE_API_BASE
              value: http://jevk5-redqueen:8191
            - name: XDG_CACHE_HOME
              value: /app/cache
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: cache
              mountPath: /app/cache
            - name: migrations
              mountPath: /app/migrations
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        - name: migrations
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      terminationGracePeriodSeconds: 90
