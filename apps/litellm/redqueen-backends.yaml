    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: litellm
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: qwen-redqueen
  namespace: litellm
