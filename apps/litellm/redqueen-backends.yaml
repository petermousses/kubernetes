    kubernetes.io/service-name: qwen-redqueen
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: litellm
addressType: IPv4
ports:
  - name: http
    port: 8081
    protocol: TCP
endpoints:
  - addresses:
      - 10.9.20.242
    conditions:
      ready: true
