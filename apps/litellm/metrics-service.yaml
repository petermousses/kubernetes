apiVersion: v1
kind: Service
metadata:
  name: litellm-metrics
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: litellm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
  ports:
    - name: metrics
      port: 4001
      targetPort: metrics
      protocol: TCP
