apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-migrations-v1-103-0
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: migrations
    app.kubernetes.io/part-of: litellm
    app.kubernetes.io/version: 1.103.0
spec:
  # The image's resolver performs its own bounded retries. Retain the first
  # failed Pod so its logs survive and the operator can diagnose the cause.
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: migrations
        app.kubernetes.io/part-of: litellm
        app.kubernetes.io/version: 1.103.0
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: migrations
          # ghcr.io/berriai/litellm-migrations:v1.103.0; Cosign-verified index digest.
          image: ghcr.io/berriai/litellm-migrations@sha256:dac0d22bbb18c418f45a5d1bf7c2cc044c812b77de23171df106d1cbb7fcbed5
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: DATABASE_URL
            - name: USE_V2_MIGRATION_RESOLVER
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      nodeSelector:
        kubernetes.io/hostname: openmediavault
