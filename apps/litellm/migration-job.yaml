apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-migrations-v1-104-2
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: migrations
    app.kubernetes.io/part-of: litellm
    app.kubernetes.io/version: 1.104.2
spec:
  # Retain the first failed Pod so its logs survive and the operator can
  # diagnose the cause.
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: migrations
        app.kubernetes.io/part-of: litellm
        app.kubernetes.io/version: 1.104.2
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          # postgres:16.14-bookworm
          image: docker.io/library/postgres@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              readiness_timeout_seconds=600
              retry_delay_seconds=5
              readiness_deadline=$(( $(date +%s) + readiness_timeout_seconds ))

              while ! pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 1 >/dev/null 2>&1; do
                remaining_seconds=$((readiness_deadline - $(date +%s)))
                if [ "$remaining_seconds" -le 0 ]; then
                  printf '%s\n' 'PostgreSQL did not become reachable within 600 seconds.' >&2
                  exit 1
                fi
                if [ "$remaining_seconds" -lt "$retry_delay_seconds" ]; then
                  sleep "$remaining_seconds"
                else
                  sleep "$retry_delay_seconds"
                fi
              done
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_DB
              value: litellm
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: migrations
          # ghcr.io/berriai/litellm-migrations:v1.104.2; pinned GHCR OCI index digest.
          image: ghcr.io/berriai/litellm-migrations@sha256:35c0d71472914586ad683fa853403509b8a57a9975c0d1bc5d02b4adebfed91d
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: DATABASE_URL
            - name: USE_V2_MIGRATION_RESOLVER
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      nodeSelector:
        kubernetes.io/hostname: openmediavault
