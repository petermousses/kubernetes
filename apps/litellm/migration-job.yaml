apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-migrations-v1-103-0
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: migrations
    app.kubernetes.io/part-of: litellm
    app.kubernetes.io/version: 1.103.0
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: migrations
        app.kubernetes.io/part-of: litellm
        app.kubernetes.io/version: 1.103.0
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: migrations
          # ghcr.io/berriai/litellm:v1.103.0; Cosign-verified index digest.
          image: ghcr.io/berriai/litellm@sha256:bd089afdcd35b894b14a93f9743cdc8b591f82da1a38dd43a010a7b0c9de5fd7
          imagePullPolicy: IfNotPresent
          command:
            - python
            - litellm/proxy/prisma_migration.py
          workingDir: /app
          envFrom:
            - secretRef:
                name: litellm-env
          env:
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
            - name: LITELLM_MIGRATION_DIR
              value: /app/migrations
            - name: PRISMA_BINARY_CACHE_DIR
              value: /app/cache/prisma
            - name: XDG_CACHE_HOME
              value: /app/cache
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cache
              mountPath: /app/cache
            - name: migrations
              mountPath: /app/migrations
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        - name: migrations
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      nodeSelector:
        kubernetes.io/hostname: openmediavault
