apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-egress
spec:
  podSelector:
    matchLabels:
      mousses.xyz/litellm-client: "true"
  policyTypes:
    - Egress
  egress:
    # Match the LiteLLM Service IP when kube-router evaluates before DNAT.
    - to:
        - ipBlock:
            cidr: 10.43.54.134/32
      ports:
        - protocol: TCP
          port: 4000
    # Also match the LiteLLM gateway endpoint after Service DNAT.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 4000
