apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: paperless-ngx
spec:
  selector:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: cache
  ports: [{name: redis, port: 6379, targetPort: redis, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: paperless-ngx
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 0, runAsGroup: 0}
      containers:
        - name: redis
          image: redis@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
          imagePullPolicy: IfNotPresent
          ports: [{name: redis, containerPort: 6379, protocol: TCP}]
          startupProbe:
            exec: {command: [redis-cli, ping]}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: redis-data, mountPath: /data}]
      volumes:
        - name: redis-data
          persistentVolumeClaim: {claimName: paperless-redis}
      nodeSelector: {kubernetes.io/hostname: openmediavault}
      terminationGracePeriodSeconds: 30
