apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-gpt-config
  labels:
    app.kubernetes.io/name: paperless-gpt
    app.kubernetes.io/part-of: paperless-ngx
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: paperless-local
  claimRef:
    namespace: paperless-ngx
    name: paperless-gpt-config
  local:
    path: /filesystem/k3s/data/paperless-ngx/gpt-live/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - openmediavault
