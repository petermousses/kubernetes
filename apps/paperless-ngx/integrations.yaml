apiVersion: v1
kind: Service
metadata:
  name: paperless-ai
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: paperless-ngx
spec:
  selector:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: ai
  ports: [{name: http, port: 3000, targetPort: http, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ai
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: paperless-ngx
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
      app.kubernetes.io/component: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
        app.kubernetes.io/component: ai
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      securityContext: {runAsUser: 0, runAsGroup: 0}
      containers:
        - name: paperless-ai
          image: clusterzx/paperless-ai@sha256:2b65888163fd59716f1c8285b31c5bd0b30c9c3c192c42b516688e3887d4ba60
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000, protocol: TCP}]
          envFrom: [{secretRef: {name: paperless-env}}]
          env:
            - name: PAPERLESS_API_URL
              valueFrom: {configMapKeyRef: {name: paperless-config, key: PAPERLESS_API_URL}}
            - name: PAPERLESS_BASE_URL
              valueFrom: {configMapKeyRef: {name: paperless-config, key: PAPERLESS_INTERNAL_BASE_URL}}
            - name: PAPERLESS_AI_PORT
              valueFrom: {configMapKeyRef: {name: paperless-config, key: PAPERLESS_AI_PORT}}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: paperless-ai-data, mountPath: /app/data}]
      volumes:
        - name: paperless-ai-data
          persistentVolumeClaim: {claimName: paperless-ai}
      nodeSelector: {kubernetes.io/hostname: openmediavault}
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-gpt
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: gpt
    app.kubernetes.io/part-of: paperless-ngx
spec:
  selector:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: gpt
  ports: [{name: http, port: 8080, targetPort: http, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-gpt
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: gpt
    app.kubernetes.io/part-of: paperless-ngx
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
      app.kubernetes.io/component: gpt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
        app.kubernetes.io/component: gpt
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      securityContext: {runAsUser: 0, runAsGroup: 0}
      containers:
        - name: paperless-gpt
          image: icereed/paperless-gpt@sha256:15bad5d455b98f21bb7b5d6615f56871ff67a8bb379dc0dd7ba411f4633071a6
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          envFrom: [{secretRef: {name: paperless-env}}]
          env:
            - name: PAPERLESS_API_URL
              valueFrom: {configMapKeyRef: {name: paperless-config, key: PAPERLESS_API_URL}}
            - name: PAPERLESS_BASE_URL
              valueFrom: {configMapKeyRef: {name: paperless-config, key: PAPERLESS_INTERNAL_BASE_URL}}
            - name: LLM_PROVIDER
              valueFrom: {configMapKeyRef: {name: paperless-config, key: LLM_PROVIDER}}
            - name: LLM_MODEL
              valueFrom: {configMapKeyRef: {name: paperless-config, key: LLM_MODEL}}
            - name: LLM_LANGUAGE
              valueFrom: {configMapKeyRef: {name: paperless-config, key: LLM_LANGUAGE}}
            - name: OCR_PROVIDER
              valueFrom: {configMapKeyRef: {name: paperless-config, key: OCR_PROVIDER}}
            - name: AUTO_TAG
              valueFrom: {configMapKeyRef: {name: paperless-config, key: AUTO_TAG}}
            - name: MANUAL_TAG
              valueFrom: {configMapKeyRef: {name: paperless-config, key: MANUAL_TAG}}
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: paperless-gpt-prompts, mountPath: /app/prompts}]
      volumes:
        - name: paperless-gpt-prompts
          persistentVolumeClaim: {claimName: paperless-gpt}
      nodeSelector: {kubernetes.io/hostname: openmediavault}
      terminationGracePeriodSeconds: 60
