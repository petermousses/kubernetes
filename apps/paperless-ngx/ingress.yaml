apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: paperless-ngx
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Paperless
    gethomepage.dev/name: Paperless-ngx
    gethomepage.dev/icon: mdi-text
    gethomepage.dev/description: Document management system
spec:
  ingressClassName: traefik
  tls:
    - hosts: [paperless.omv.mousses.xyz]
      secretName: paperless-tls
  rules:
    - host: paperless.omv.mousses.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: paperless, port: {name: http}}
---
