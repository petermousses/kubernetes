  name: redis-restore-data
  namespace: paperless-restore-validation
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: paperless-backup-local
  volumeName: paperless-redis-restore-data
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-redis-restore-native
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: paperless-backup-local
  claimRef:
    namespace: paperless-restore-validation
    name: redis-restore-native
  local:
    path: "/filesystem/k3s/data/paperless-ngx/restore-validation/paperless-redis/initial/native"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - openmediavault
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-restore-native
  namespace: paperless-restore-validation
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: paperless-backup-local
  volumeName: paperless-redis-restore-native
  resources:
    requests:
      storage: 10Gi
