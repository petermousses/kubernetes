---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: data-restore-initial
  namespace: paperless-restore-validation
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  paused: true
  trigger:
    manual: controlled-by-restore-runner
  restic:
    destinationPVC: data-restore-artifacts
    copyMethod: Direct
    repository: restic-restore-paperless-data
    customCA:
      secretName: restic-restore-ca
      key: ca.crt
    cacheCapacity: 1Gi
    cacheAccessModes:
    - ReadWriteOnce
    cacheStorageClassName: paperless-backup-local
    cleanupCachePVC: false
    enableFileDeletion: false
    moverPodLabels:
      backups.mousses.xyz/restic-client: 'true'
      app.kubernetes.io/part-of: paperless-ngx
    moverResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - openmediavault
