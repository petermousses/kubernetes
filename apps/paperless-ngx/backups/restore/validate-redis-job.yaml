---
apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-redis-restore-initial
  namespace: paperless-restore-validation
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-restore-validation
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: validate
        image: redis@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
        command:
        - "/bin/sh"
        - "-eu"
        - "-c"
        args:
        - |
          umask 077
          case "$BACKUP_ID" in initial-*) ;; *) exit 1 ;; esac
          test -z "$(ls -A /database)"
          mkdir -m 0700 /database/native
          chmod 0700 /database/native
          cp /restored/validated/tree/dump.rdb /database/native/dump.rdb
          chmod 0600 /database/native/dump.rdb
          redis-check-rdb /database/native/dump.rdb >/database/native/check.log 2>&1
          redis-server --port 0 --unixsocket /tmp/redis.sock --unixsocketperm 700 \
            --dir /database/native --dbfilename dump.rdb --save '' --appendonly no \
            --logfile /database/native/server.log >/database/native/start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          attempt=0
          until test "$(redis-cli -s /tmp/redis.sock --raw PING 2>/dev/null)" = PONG; do
            kill -0 "$server_pid"
            attempt=$((attempt + 1))
            test "$attempt" -lt 60
            sleep 1
          done
          redis-cli -s /tmp/redis.sock --raw INFO persistence > /database/native/persistence.txt
          grep -q '^loading:0' /database/native/persistence.txt
          redis-cli -s /tmp/redis.sock --raw INFO keyspace > /database/native/keyspace.txt
          cmp /restored/validated/tree/dump.rdb /database/native/dump.rdb
          redis-cli -s /tmp/redis.sock --raw SHUTDOWN NOSAVE
          wait "$server_pid"
          trap - EXIT
          printf '{"result":"passed","backup_id":"%s","native_rdb_loaded":true,"tcp_listener":false}\n' "$BACKUP_ID" > /database/validation-result.json
          chmod 0600 /database/validation-result.json
          sync /database/validation-result.json
          printf 'isolated native Redis restore passed; Unix socket only, original RDB unchanged\n'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: restored
          mountPath: "/restored"
          readOnly: true
        - name: database
          mountPath: "/database"
        - name: temp
          mountPath: "/tmp"
        env: []
      volumes:
      - name: restored
        persistentVolumeClaim:
          claimName: redis-restore-data
          readOnly: true
      - name: database
        persistentVolumeClaim:
          claimName: redis-restore-native
      - name: temp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
