---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: paperless-restore-validation
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restore-repository-egress
  namespace: paperless-restore-validation
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  podSelector:
    matchLabels:
      backups.mousses.xyz/restic-client: 'true'
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: paperless-ngx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: restic-server
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
