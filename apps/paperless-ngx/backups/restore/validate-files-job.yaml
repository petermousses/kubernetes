---
apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-files-restore-initial
  namespace: paperless-restore-validation
  labels:
    app.kubernetes.io/managed-by: nas-backup-migration
    app.kubernetes.io/part-of: paperless-ngx
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-restore-validation
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: validate
        image: quay.io/backube/volsync@sha256:0d03a6aad57569eba2c0eaa0848cf4a908d9744b372ff2224bb291a320f36d76
        command:
        - python3
        - "-I"
        - "-B"
        - "-u"
        - "/code/paperless-restore.py"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: "/code"
          readOnly: true
        - name: temp
          mountPath: "/tmp"
        - name: data-artifacts
          mountPath: "/artifacts-data"
          readOnly: true
        - name: data-data
          mountPath: "/restore-data"
        - name: ai-artifacts
          mountPath: "/artifacts-ai"
          readOnly: true
        - name: ai-data
          mountPath: "/restore-ai"
        - name: gpt-artifacts
          mountPath: "/artifacts-gpt"
          readOnly: true
        - name: gpt-data
          mountPath: "/restore-gpt"
        - name: gpt-config-artifacts
          mountPath: "/artifacts-gpt-config"
          readOnly: true
        - name: gpt-config-data
          mountPath: "/restore-gpt-config"
        - name: gpt-db-artifacts
          mountPath: "/artifacts-gpt-db"
          readOnly: true
        - name: gpt-db-data
          mountPath: "/restore-gpt-db"
        - name: postgres-artifacts
          mountPath: "/artifacts-postgres"
          readOnly: true
        - name: postgres-data
          mountPath: "/restore-postgres"
        - name: redis-artifacts
          mountPath: "/artifacts-redis"
          readOnly: true
        - name: redis-data
          mountPath: "/restore-redis"
      volumes:
      - name: code
        configMap:
          name: injected-by-restore-runner
          defaultMode: 292
      - name: temp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
      - name: data-artifacts
        persistentVolumeClaim:
          claimName: data-restore-artifacts
          readOnly: true
      - name: data-data
        persistentVolumeClaim:
          claimName: data-restore-data
      - name: ai-artifacts
        persistentVolumeClaim:
          claimName: ai-restore-artifacts
          readOnly: true
      - name: ai-data
        persistentVolumeClaim:
          claimName: ai-restore-data
      - name: gpt-artifacts
        persistentVolumeClaim:
          claimName: gpt-restore-artifacts
          readOnly: true
      - name: gpt-data
        persistentVolumeClaim:
          claimName: gpt-restore-data
      - name: gpt-config-artifacts
        persistentVolumeClaim:
          claimName: gpt-config-restore-artifacts
          readOnly: true
      - name: gpt-config-data
        persistentVolumeClaim:
          claimName: gpt-config-restore-data
      - name: gpt-db-artifacts
        persistentVolumeClaim:
          claimName: gpt-db-restore-artifacts
          readOnly: true
      - name: gpt-db-data
        persistentVolumeClaim:
          claimName: gpt-db-restore-data
      - name: postgres-artifacts
        persistentVolumeClaim:
          claimName: postgres-restore-artifacts
          readOnly: true
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-restore-data
      - name: redis-artifacts
        persistentVolumeClaim:
          claimName: redis-restore-artifacts
          readOnly: true
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-restore-data
