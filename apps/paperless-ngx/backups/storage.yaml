apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: paperless-backup-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-restic-repositories
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: paperless-backup-local
  claimRef:
    namespace: paperless-ngx
    name: restic-repositories
  local:
    path: /filesystem/k3s/data/paperless-ngx/backups
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic-repositories
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: paperless-backup-local
  volumeName: paperless-restic-repositories
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
