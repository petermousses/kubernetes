apiVersion: batch/v1
kind: Job
metadata:
  generateName: restic-repository-check-
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: restic-repository-check
    app.kubernetes.io/part-of: paperless-ngx
    app.kubernetes.io/managed-by: nas-backup-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic-repository-check
        app.kubernetes.io/part-of: paperless-ngx
        backups.mousses.xyz/restic-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options: [{name: ndots, value: "1"}]
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          # VolSync 0.16.0 includes Restic 0.18.1 and Python 3.
          image: quay.io/backube/volsync@sha256:0d03a6aad57569eba2c0eaa0848cf4a908d9744b372ff2224bb291a320f36d76
          command: [/bin/bash, -euc]
          args:
            - |
              python3 - <<'PY'
              import base64
              import ipaddress
              import os
              import socket
              import ssl
              import time
              import urllib.error
              import urllib.parse
              import urllib.request
              from pathlib import Path

              url = os.environ["RESTIC_REPOSITORY"].removeprefix("rest:")
              # The setup script supplies the live Service's IPs, never a saved IP.
              expected_addresses = {
                  str(ipaddress.ip_address(value))
                  for value in os.environ["EXPECTED_RESTIC_IPS"].split(",")
              }
              print("pod resolver configuration:\n" +
                    Path("/etc/resolv.conf").read_text(), flush=True)
              context = ssl.create_default_context(cafile="/ca/ca.crt")
              context.minimum_version = ssl.TLSVersion.TLSv1_3
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, request, file, code, message, headers, target):
                      return None
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({}),
                  urllib.request.HTTPSHandler(context=context),
                  NoRedirect(),
              )
              credentials = (os.environ["RESTIC_REST_USERNAME"] + ":" +
                             os.environ["RESTIC_REST_PASSWORD"])
              auth = "Basic " + base64.b64encode(credentials.encode()).decode()

              def status(target, authenticated, timeout=15, wrong_password=False):
                  headers = {"Authorization": auth} if authenticated else {}
                  if wrong_password:
                      bad = os.environ["RESTIC_REST_USERNAME"] + ":" + os.environ["RESTIC_REST_PASSWORD"] + "-invalid"
                      headers = {"Authorization": "Basic " + base64.b64encode(bad.encode()).decode()}
                  request = urllib.request.Request(target, headers=headers)
                  try:
                      with opener.open(request, timeout=timeout) as response:
                          return response.status
                  except urllib.error.HTTPError as error:
                      return error.code

              # Deployment readiness can precede Service/policy propagation.
              # Retry transport errors only; certificate and access failures
              # remain fatal, and credentials are never printed.
              deadline = time.monotonic() + 60
              last_error = "no connection established"
              target = urllib.parse.urlsplit(url)
              last_addresses = None
              while time.monotonic() < deadline:
                  try:
                      addresses = sorted({
                          str(ipaddress.ip_address(item[4][0]))
                          for item in socket.getaddrinfo(
                              target.hostname, target.port or 443, type=socket.SOCK_STREAM,
                          )
                      })
                      if addresses != last_addresses:
                          print("repository DNS: " + target.hostname + " -> " +
                                ", ".join(addresses), flush=True)
                          last_addresses = addresses
                      if not addresses or set(addresses) != expected_addresses:
                          raise SystemExit(
                              "repository DNS does not match the Service IPs: expected " +
                              ", ".join(sorted(expected_addresses))
                          )
                      unauthenticated_status = status(
                          url + "config", False,
                          timeout=min(15, max(0.1, deadline - time.monotonic())),
                      )
                      break
                  except (urllib.error.URLError, OSError) as error:
                      reason = getattr(error, "reason", error)
                      if isinstance(reason, ssl.SSLError):
                          raise SystemExit("TLS verification failed: " + str(reason))
                      last_error = str(reason)
                      print("waiting for repository endpoint: " + last_error, flush=True)
                      time.sleep(min(2, max(0, deadline - time.monotonic())))
              else:
                  raise SystemExit("repository endpoint unavailable: " + last_error)

              if unauthenticated_status != 401:
                  raise SystemExit("unauthenticated access was not rejected")
              if status(url + "config", True, wrong_password=True) != 401:
                  raise SystemExit("invalid password was not rejected")
              for other_repository in os.environ["OTHER_REPOSITORIES"].split(","):
                  forbidden = urllib.parse.urljoin(url, "/" + other_repository + "/config")
                  if status(forbidden, True) not in (401, 403):
                      raise SystemExit("repository isolation check failed")
              if status(url + "config", True) not in (200, 404):
                  raise SystemExit("authenticated repository access failed")
              print("TLS, authentication, and repository isolation verified", flush=True)
              PY

              set +e
              timeout 60s restic --cacert /ca/ca.crt --no-cache cat config \
                >/dev/null 2>/tmp/restic-open-error
              restic_status=$?
              set -e
              case "$restic_status" in
                0) ;;
                10) restic --cacert /ca/ca.crt --no-cache init --repository-version 2 ;;
                *) cat /tmp/restic-open-error >&2; exit "$restic_status" ;;
              esac
              restic --cacert /ca/ca.crt --no-cache check
              restic --cacert /ca/ca.crt --no-cache snapshots --json
          envFrom:
            - secretRef:
                name: restic-paperless-data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: ca
          secret:
            secretName: restic-root-ca
            items:
              - key: tls.crt
                path: ca.crt
        - name: temp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
