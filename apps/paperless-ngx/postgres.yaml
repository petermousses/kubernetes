apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: paperless-ngx
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: database
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: paperless-ngx
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: paperless-ngx
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 0, runAsGroup: 0}
      containers:
        - name: postgres
          image: postgres@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432, protocol: TCP}]
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: paperless-env, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: paperless-env, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: paperless-env, key: POSTGRES_PASSWORD}}
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: postgres-data, mountPath: /var/lib/postgresql}
      volumes:
        - name: postgres-data
          persistentVolumeClaim: {claimName: paperless-postgres}
      nodeSelector: {kubernetes.io/hostname: openmediavault}
      terminationGracePeriodSeconds: 60
