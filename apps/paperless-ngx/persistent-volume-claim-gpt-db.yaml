apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-gpt-db
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-gpt
    app.kubernetes.io/part-of: paperless-ngx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
  storageClassName: paperless-local
  volumeName: paperless-gpt-db
