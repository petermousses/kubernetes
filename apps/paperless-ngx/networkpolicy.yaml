apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-integrations-to-paperless
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [ai, gpt]}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-integrations-to-paperless-egress
  namespace: paperless-ngx
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [ai, gpt]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: paperless-ngx, app.kubernetes.io/component: web}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-paperless-web-dependencies-egress
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: paperless-ngx, app.kubernetes.io/component: web}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: paperless-ngx, app.kubernetes.io/component: database}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: paperless-ngx, app.kubernetes.io/component: cache}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: paperless-ngx, app.kubernetes.io/component: converter}
      ports: [{protocol: TCP, port: 3000}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: paperless-ngx, app.kubernetes.io/component: extractor}
      ports: [{protocol: TCP, port: 9998}]
