apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-web-ingress
  namespace: paperless-ngx
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: paperless-ngx, app.kubernetes.io/component: web}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8000}]
---
