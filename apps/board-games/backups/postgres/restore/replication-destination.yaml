apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: postgres-restore-initial
  labels:
    app.kubernetes.io/name: postgres-restore-initial
    app.kubernetes.io/part-of: board-games
spec:
  paused: true
  trigger:
    manual: controlled-by-restore-runner
  restic:
    destinationPVC: postgres-restore-artifacts
    copyMethod: Direct
    repository: postgres-restore-restic-auth
    customCA:
      secretName: postgres-restore-ca
      key: ca.crt
    # The NAS runner injects restoreAsOf from the completed initial upload.
    cacheCapacity: 1Gi
    cacheAccessModes: [ReadWriteOnce]
    cacheStorageClassName: board-games-backup-local
    cleanupCachePVC: false
    enableFileDeletion: false
    moverPodLabels:
      backups.mousses.xyz/restic-client: "true"
      app.kubernetes.io/part-of: board-games
    moverResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [openmediavault]
