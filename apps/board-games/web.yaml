apiVersion: v1
kind: Service
metadata:
  name: board-games-web
  labels:
    app.kubernetes.io/name: board-games-web
    app.kubernetes.io/part-of: board-games
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: board-games-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-games-web
  labels:
    app.kubernetes.io/name: board-games-web
    app.kubernetes.io/part-of: board-games
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: board-games-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: board-games-web
        app.kubernetes.io/part-of: board-games
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Published by board-games CI run 34158243340 for commit fe9deaf4ef774ea963ee0833feef7154dbe54881.
          image: ghcr.io/petermousses/board-games-web@sha256:021a2f6b4a2aaae8d952b05cbf8bd21f8afe20acdfbdd6d2b1bcac1252c21a2c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
