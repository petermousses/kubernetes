apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-data-live
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: n8n-local
  claimRef:
    namespace: n8n
    name: n8n-data-live
  local:
    path: /filesystem/k3s/data/n8n/live-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - openmediavault
