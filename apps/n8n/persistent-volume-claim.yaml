apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: n8n-local
  volumeName: n8n-data
  resources:
    requests:
      storage: 10Gi
