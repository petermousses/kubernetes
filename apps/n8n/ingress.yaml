apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Utilities
    gethomepage.dev/name: n8n
    gethomepage.dev/icon: n8n.svg
    gethomepage.dev/description: Workflow automation
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`n8n.omv.mousses.xyz`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      services:
        - name: authentik-outpost
          port: http
    - kind: Rule
      match: Host(`n8n.omv.mousses.xyz`)
      priority: 50
      middlewares:
        - name: authentik-forward-auth
        - name: security-headers
      services:
        - name: n8n
          port: http
  tls:
    secretName: n8n-tls
