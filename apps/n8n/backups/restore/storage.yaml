apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-images-restore-artifacts
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: n8n-backup-local
  claimRef:
    namespace: n8n
    name: images-restore-artifacts
  local:
    path: /filesystem/k3s/data/n8n/restore-validation/n8n-images/initial/artifacts
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: images-restore-artifacts
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: n8n-backup-local
  volumeName: n8n-images-restore-artifacts
  resources:
    requests:
      storage: 10Gi
---
