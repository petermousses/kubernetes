apiVersion: v1
kind: PersistentVolume
metadata:
  name: librechat-mongodb
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: librechat
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: librechat-local
  local:
    path: /filesystem/k3s/data/librechat/mongodb
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - openmediavault
