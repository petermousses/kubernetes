apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: librechat
spec:
  selector:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: 7700
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: librechat
spec:
  serviceName: meilisearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: librechat
      app.kubernetes.io/component: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: librechat
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: librechat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: meilisearch
          # getmeili/meilisearch:v1.35.1
          image: docker.io/getmeili/meilisearch@sha256:8b57fc3c7f46535ddef3828df1538465ac19d892eb57c9a10da6df0880bd5856
          imagePullPolicy: IfNotPresent
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-env
                  key: MEILI_MASTER_KEY
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: librechat-meilisearch
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      terminationGracePeriodSeconds: 30
