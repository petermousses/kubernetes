apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librechat
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: librechat
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: librechat-security-headers@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: LibreChat
    gethomepage.dev/icon: mdi-robot-outline
    gethomepage.dev/description: AI chat through Authentik and LiteLLM.
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chat.omv.mousses.xyz
      secretName: librechat-tls
  rules:
    - host: chat.omv.mousses.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: librechat
                port:
                  name: http
