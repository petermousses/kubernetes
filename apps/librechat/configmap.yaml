apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: librechat
data:
  HOST: 0.0.0.0
  PORT: "3080"
  NODE_ENV: production
  DOMAIN_CLIENT: https://chat.omv.mousses.xyz
  DOMAIN_SERVER: https://chat.omv.mousses.xyz
  MONGO_URI: mongodb://mongodb:27017/LibreChat
  MEILI_HOST: http://meilisearch:7700
  MEILI_NO_ANALYTICS: "true"
  SEARCH: "true"
  SEARXNG_INSTANCE_URL: http://searxng.searxng.svc.cluster.local:8080
  CONFIG_PATH: /app/librechat.yaml
  LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
  OPENID_ISSUER: https://auth.omv.mousses.xyz/application/o/librechat/.well-known/openid-configuration
  OPENID_CALLBACK_URL: /oauth/openid/callback
  OPENID_SCOPE: openid profile email
  OPENID_BUTTON_LABEL: Sign in with Authentik
  OPENID_USE_END_SESSION_ENDPOINT: "true"
  OPENID_REQUIRED_ROLE: librechat_users
  OPENID_REQUIRED_ROLE_TOKEN_KIND: id
  OPENID_REQUIRED_ROLE_PARAMETER_PATH: groups
  OPENID_ADMIN_ROLE: librechat_admin
  OPENID_ADMIN_ROLE_TOKEN_KIND: id
  OPENID_ADMIN_ROLE_PARAMETER_PATH: groups
  ALLOW_SOCIAL_LOGIN: "true"
  ALLOW_REGISTRATION: "false"
  # Keep the local login form during the staged OIDC test. No local account is
  # bootstrapped; turn this off only after authorized/admin/denied tests pass.
  ALLOW_EMAIL_LOGIN: "true"
  IMAGE_GEN_OAI_MODEL: qwen-image-2.1
  IMAGE_GEN_OAI_BASEURL: http://litellm.litellm.svc.cluster.local:4000/v1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-custom-config
  namespace: librechat
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: librechat
data:
  librechat.yaml: |
    version: 1.3.16
    cache: true
    interface:
      fileSearch: false
    endpoints:
      custom:
        - name: LiteLLM
          apiKey: '${LITELLM_API_KEY}'
          baseURL: http://litellm.litellm.svc.cluster.local:4000/v1
          models:
            default: [qwen3.8-27b]
            fetch: true
          tokenConfig:
            qwen3.8-27b:
              prompt: 0.544
              completion: 3.263
              context: 220000
            gemma-4-e4b-it:
              prompt: 0.02
              completion: 0.1
              context: 220000
            gemma-4-12b-it:
              prompt: 0.1
              completion: 0.3
              context: 220000
            gemma-4-26b-a4b-it:
              prompt: 0.14
              completion: 0.4
              context: 220000
            qwen3.6-35b-a3b:
              prompt: 0.24
              completion: 1.8
              context: 220000
            glm-5.3-flash-abliterated:
              prompt: 0.15
              completion: 0.5
              context: 220000
          titleConvo: true
          titleModel: qwen3.8-27b
          modelDisplayLabel: Local AI
    webSearch:
      searchProvider: searxng
      searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
      allowedAddresses:
        - searxng.searxng.svc.cluster.local:8080
