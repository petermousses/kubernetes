apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: librechat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: librechat
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: librechat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: librechat
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat
              app.kubernetes.io/component: search
      ports:
        - protocol: TCP
          port: 7700
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 4000
    # The public OIDC issuer resolves to the NAS's HTTPS Traefik entrypoint.
    # Verify this DNS mapping from the NAS before deployment; do not open
    # unrestricted public egress just to make discovery succeed.
    - to:
        - ipBlock:
            cidr: 10.9.20.14/32
      ports:
        - protocol: TCP
          port: 443
---
