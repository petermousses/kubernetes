apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: librechat-backup-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: librechat-restic-repositories
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: librechat-backup-local
  claimRef:
    namespace: librechat
    name: restic-repositories
  local:
    path: /filesystem/k3s/data/librechat/backups
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic-repositories
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: librechat-backup-local
  volumeName: librechat-restic-repositories
  resources:
    requests:
      storage: 100Gi
---
