apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-database
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-database
    app.kubernetes.io/part-of: immich
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-database
        app.kubernetes.io/part-of: immich
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: immich-config
                  key: DB_USERNAME
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: immich-config
                  key: DB_DATABASE_NAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: DB_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
          startupProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - postgres
                - -d
                - immich
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - postgres
                - -d
                - immich
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - postgres
                - -d
                - immich
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-shm
              mountPath: /dev/shm
            - name: host-time
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: immich-postgres
        - name: postgres-shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: File
      terminationGracePeriodSeconds: 120
