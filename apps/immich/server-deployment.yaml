apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/part-of: immich
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
        app.kubernetes.io/part-of: immich
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        kubernetes.io/hostname: openmediavault
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server@sha256:0cc1f82953d9598eb9e9dd11cbde1f50fe54f9c46c4506b089e8ad7bfc9d1f0c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2283
              protocol: TCP
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: immich-library
              mountPath: /data
            - name: external-photos
              mountPath: /external/photos
              readOnly: true
            # The Docker source for this mount is currently malformed and
            # absent on the host. Keep the path present but empty until the
            # external-library source is deliberately corrected.
            - name: missing-google-photos
              mountPath: /external/google_photos_peter
              readOnly: true
            - name: host-time
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        - name: immich-library
          persistentVolumeClaim:
            claimName: immich-library
        - name: external-photos
          persistentVolumeClaim:
            claimName: immich-external-photos
            readOnly: true
        - name: missing-google-photos
          emptyDir: {}
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: File
      terminationGracePeriodSeconds: 90
