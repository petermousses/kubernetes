---
# The manually curated links remain equivalent to the Docker Homepage stack.
# Kubernetes Ingress annotations add migrated workloads automatically.

- Utilities:
    - Canon Printer:
        icon: mdi-printer
        href: https://printer.{{HOMEPAGE_VAR_DOMAIN_NAME}}
        description: Remotely Check Ink Levels
        ping: printer.{{HOMEPAGE_VAR_DOMAIN_NAME}}
    - Home Assistant:
        icon: home-assistant.svg
        href: http://homeassistant.{{HOMEPAGE_VAR_DOMAIN_NAME}}:8123
        description: Smart Home Interface
        siteMonitor: http://homeassistant.{{HOMEPAGE_VAR_DOMAIN_NAME}}:8123
        widget:
          type: homeassistant
          url: http://homeassistant.{{HOMEPAGE_VAR_DOMAIN_NAME}}:8123
          key: {{HOMEPAGE_VAR_HOMEASSISTANT_API_KEY}}
          custom:
            - state: binary_sensor.door_sensors
              label: Doors

- Minecraft:
    - Minecraft Server Management:
        icon: minecraft.svg
        href: https://crafty.{{HOMEPAGE_VAR_HOST_DOMAIN_NAME}}
        description: Crafty Management Service
        widget:
