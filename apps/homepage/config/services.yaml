          # Homepage's Minecraft widget uses this URL form for Java status too.
          url: udp://crafty-java.crafty:25565
    - Square Map:
        icon: minecraft.svg
        href: https://map.{{HOMEPAGE_VAR_HOST_DOMAIN_NAME}}
