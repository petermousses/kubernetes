apiVersion: apps/v1
kind: Deployment
metadata:
  name: text2shop
  namespace: text2shop
  labels:
    app.kubernetes.io/name: text2shop
    app.kubernetes.io/part-of: text2shop
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: text2shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: text2shop
        app.kubernetes.io/part-of: text2shop
    spec:
      automountServiceAccountToken: false
      containers:
        - name: text2shop
          # Published GHCR develop image from commit 713ee101de8ce60ecaac519a0f65b44b8250c415.
          image: ghcr.io/petermousses/text2shop@sha256:e0ab9d02bf36392afb47ae81902d1cfc79e5c5a875784deea7b685f0ea8f6a27
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: text2shop-env
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 10
