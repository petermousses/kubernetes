apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-config
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: open-webui
data:
  DOMAIN_NAME: mousses.xyz
  LOCAL_DOMAIN_NAME: omv.mousses.xyz
  PROJECT_SUB_DOMAIN: chat
  OLLAMA_BASE_URL: http://tower.mousses.xyz:11434
  ENABLE_RAG_WEB_SEARCH: "True"
  RAG_WEB_SEARCH_ENGINE: searxng
  RAG_WEB_SEARCH_RESULT_COUNT: "3"
  RAG_WEB_SEARCH_CONCURRENT_REQUESTS: "10"
  # SearXNG remains a separate Docker-managed service. This route avoids the
  # Docker-only `searxng` network alias used by the Compose deployment.
  SEARXNG_QUERY_URL: https://search.omv.mousses.xyz/search?q=<query>
