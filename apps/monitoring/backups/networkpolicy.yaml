apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restic-server-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restic-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              backups.mousses.xyz/restic-client: "true"
      ports:
        - protocol: TCP
          port: 8000
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restic-client-egress
spec:
  podSelector:
    matchLabels:
      backups.mousses.xyz/restic-client: "true"
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: restic-server
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
