apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: monitoring-backup-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-restic-repositories
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring-backup-local
  claimRef:
    namespace: monitoring
    name: restic-repositories
  local:
    path: /filesystem/k3s/data/monitoring/backups
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restic-repositories
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: monitoring-backup-local
  volumeName: monitoring-restic-repositories
  resources:
    requests:
      storage: 1Ti
---
