    namespace: monitoring
    name: prometheus-backup-staging
  local:
    path: /filesystem/k3s/data/monitoring/backup-staging/prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [openmediavault]
---
