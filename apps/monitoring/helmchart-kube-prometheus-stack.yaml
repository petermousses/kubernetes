apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  # kube-prometheus-stack 91.4.1 / appVersion v0.94.0
  # sha256: 1bd5e7a88e758ed3ec22db0fe6e72b1352f3f0e7e5a93c79979f7edf361becdb
  chart: https://github.com/prometheus-community/helm-charts/releases/download/kube-prometheus-stack-91.4.1/kube-prometheus-stack-91.4.1.tgz
  targetNamespace: monitoring
  createNamespace: true
  failurePolicy: abort
  timeout: 15m
  valuesContent: |-
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: monitoring-local
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
    grafana:
      defaultDashboardsEnabled: true
      startupProbe:
        httpGet:
          path: /api/health
          port: grafana
        failureThreshold: 60
        periodSeconds: 10
        timeoutSeconds: 5
      persistence:
        enabled: true
        storageClassName: monitoring-local
        size: 5Gi
      serviceMonitor:
        enabled: true
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local
          jsonData:
            maxLines: 1000
    prometheus:
      prometheusSpec:
        retention: 7d
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: monitoring-local
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
