apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-litellm-admin-oidc-blueprint
  namespace: authentik
data:
  litellm-admin.yaml: |
    version: 1
    metadata:
      name: AI - LiteLLM Admin OIDC
    entries:
      - model: authentik_core.group
        id: litellm-admin-group
        identifiers:
          name: litellm_admin
        attrs:
          is_superuser: false
      - model: authentik_providers_oauth2.scopemapping
        id: litellm-role-scope
        identifiers:
          name: LiteLLM Admin Role Mapping
        attrs:
          scope_name: litellm_role
          description: LiteLLM proxy role for the Admin UI
          expression: |
            group_names = [group.name for group in request.user.groups.all()]
            if "litellm_admin" in group_names:
                return {"litellm_role": "proxy_admin"}
            return {"litellm_role": "internal_user"}
      - model: authentik_providers_oauth2.oauth2provider
        id: litellm-admin-provider
        identifiers:
          name: litellm-admin-oidc
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types: [authorization_code]
          client_id: !Env LITELLM_ADMIN_OIDC_CLIENT_ID
          client_secret: !Env LITELLM_ADMIN_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://admin.ai.omv.mousses.xyz/sso/callback
          issuer_mode: per_provider
          include_claims_in_id_token: true
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !KeyOf litellm-role-scope
      - model: authentik_core.application
        id: litellm-admin-app
        identifiers:
          slug: litellm-admin
        attrs:
          name: LiteLLM Admin
          provider: !KeyOf litellm-admin-provider
          meta_launch_url: https://admin.ai.omv.mousses.xyz/ui
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf litellm-admin-app
          order: 10
        attrs:
          group: !KeyOf litellm-admin-group
