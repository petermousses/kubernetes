# Apply separately only after the local akadmin has MFA enrolled.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Authentik
    gethomepage.dev/group: Security
    gethomepage.dev/icon: mdi-shield-lock
    gethomepage.dev/description: Identity provider and single sign-on
    gethomepage.dev/href: https://auth.omv.mousses.xyz
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.omv.mousses.xyz`)
      middlewares:
        - name: security-headers
      services:
        - name: authentik-server
          port: http
  tls:
    secretName: authentik-tls
