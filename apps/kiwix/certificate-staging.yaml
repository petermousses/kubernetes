kind: Certificate
metadata:
  name: kiwix-staging
  namespace: kiwix
  labels:
    app.kubernetes.io/name: kiwix
    app.kubernetes.io/part-of: kiwix
spec:
  secretName: kiwix-tls-staging
  dnsNames:
    - wiki.omv.mousses.xyz
  issuerRef:
    name: letsencrypt-staging-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
