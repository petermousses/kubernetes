apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-agent-config
  labels:
    app.kubernetes.io/part-of: minecraft-agent
data:
  LITELLM_BASE_URL: http://litellm.litellm.svc.cluster.local:4000
  PLANNER_MODEL: qwen3.8-27b
  CONTROLLER_MODEL: jevk5-4b-v0.3
  MC_VIEW_DISTANCE: "4"
  NATIVE_RENDER_DISTANCE: "4"
  LP_NUM_THREADS: "3"
  NODE_OPTIONS: --max-old-space-size=768
  NATIVE_JAVA_XMX: 768M
