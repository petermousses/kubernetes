  STATUS_PORT: "3078"
  VIEWER_PORT: "3077"
  VIEWER_PREFIX: /viewer
  NATIVE_VIEW: "1"
  WAIT_NATIVE: "1"
  NATIVE_RECORD: "1"
  DRAGON_SENSOR_URL: http://127.0.0.1:3093
  MC_PORT: "25576"
